  <!-- The pin silhouettes are unchanged; only the internal stripes were removed. -->
  <g fill="#C0E0CF" stroke="#0B1A3B" stroke-width="36" stroke-linejoin="round">
    <g transform="translate(-540 0)">
      <use xlink:href="#pin-shape" clip-path="url(#pin-clip)"/>
    </g>
    <use xlink:href="#pin-shape" clip-path="url(#pin-clip)"/>
    <g transform="translate(-270 93) scale(1 1.00435)">
      <use xlink:href="#pin-shape" clip-path="url(#pin-clip)"/>
    </g>
  </g>

  <!-- The ball keeps its original silhouette and receives the thinner outline. -->
  <use xlink:href="#ball-shape" fill="#F7C6B7" stroke="#0B1A3B" stroke-width="36" clip-path="url(#ball-clip)"/>
</svg>
